<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de menú, se ve primero -->
  <div id="menu">
    <h1>Snake</h1>
    <p>Usá las flechas del teclado para moverte</p>
    <p>Récord: <span id="recordMenu">0</span></p>
    <button id="botonJugar">Jugar</button>
  </div>

  <!-- Pantalla del juego, arranca oculta -->
  <div id="pantallaJuego" class="oculto">
    <canvas id="juego" width="400" height="400"></canvas>
    <p>Puntos: <span id="puntaje">0</span> — Récord: <span id="recordJuego">0</span></p>

    <!-- Controles táctiles para jugar desde el celular -->
    <div id="controlesTactiles">
      <button id="btnArriba" class="botonDireccion arriba">▲</button>
      <div class="filaControles">
        <button id="btnIzquierda" class="botonDireccion izquierda">◀</button>
        <button id="btnAbajo" class="botonDireccion abajo">▼</button>
        <button id="btnDerecha" class="botonDireccion derecha">▶</button>
      </div>
    </div>

    <!-- Pantalla de fin de juego, arranca oculta -->
    <div id="pantallaGameOver" class="oculto">
      <p id="mensajeFin">Perdiste</p>
      <p id="avisoNuevoRecord" class="oculto">¡Nuevo récord!</p>
      <p id="lineaPuntajeFinal">Puntaje: <span id="puntajeFinal">0</span> — Récord: <span id="recordFinal">0</span></p>
      <button id="botonReiniciar">Reiniciar</button>
      <button id="botonMenu">Menú</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
